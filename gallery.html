<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gallery – Soul Syync</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
  <style>
    /* ── Page specific styles ── */
    body { background: var(--bg); color: var(--text); min-height: 100vh; }

    .gallery-page-hero {
      padding: 7rem 1rem 2rem;
      text-align: center;
    }
    .gallery-page-hero .section-label {
      display: inline-block;
      font-size: 0.75rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--gold);
      margin-bottom: 0.75rem;
    }
    .gallery-page-hero h1 {
      font-family: var(--font-serif, 'Cormorant Garamond', Georgia, serif);
      font-size: clamp(2.2rem, 5vw, 3.8rem);
      font-weight: 400;
      color: var(--text);
      line-height: 1.15;
      margin-bottom: 1rem;
    }
    .gallery-page-hero h1 em {
      font-style: italic;
      color: var(--gold);
    }
    .gallery-page-hero p {
      color: var(--text-muted, rgba(255,255,255,0.5));
      font-size: 1rem;
      max-width: 500px;
      margin: 0 auto 2rem;
      line-height: 1.7;
    }

    .gallery-divider {
      width: 60px; height: 1px;
      background: var(--gold);
      margin: 0 auto 3rem;
      opacity: 0.5;
    }

    /* ── Fan layout ── */
    .fan-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      padding: 0 1rem 5rem;
    }

    .fan-layout {
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100%;
      max-width: 80rem;
      height: 22rem;
    }
    @media (min-width: 480px)  { .fan-layout { height: 26rem; } }
    @media (min-width: 640px)  { .fan-layout { height: 28rem; } }
    @media (min-width: 768px)  { .fan-layout { height: 34rem; } }
    @media (min-width: 1024px) { .fan-layout { height: 38rem; } }

    .fan-card {
      position: absolute;
      width: 10rem; height: 15rem;
      border-radius: 1rem;
      overflow: hidden;
      box-shadow: 0 8px 32px rgba(0,0,0,0.4);
      cursor: pointer;
      will-change: transform, opacity;
      transform-origin: center bottom;
      border: 2px solid rgba(255,255,255,0.08);
      transition: box-shadow 0.3s;
    }
    @media (min-width: 480px)  { .fan-card { width: 11rem; height: 16.5rem; } }
    @media (min-width: 640px)  { .fan-card { width: 12rem; height: 18rem; } }
    @media (min-width: 768px)  { .fan-card { width: 14rem; height: 21rem; } }
    @media (min-width: 1024px) { .fan-card { width: 16rem; height: 24rem; } }

    .fan-card:hover { box-shadow: 0 20px 56px rgba(212,175,55,0.2), 0 8px 32px rgba(0,0,0,0.5); }
    .fan-card img   { width: 100%; height: 100%; object-fit: cover; display: block; pointer-events: none; user-select: none; }

    /* ── Pagination ── */
    .fan-pagination {
      display: none;
      align-items: center;
      justify-content: center;
      gap: 1rem;
      margin-top: 2rem;
    }
    .fan-arrow {
      display: flex; align-items: center; justify-content: center;
      width: 2.75rem; height: 2.75rem;
      border-radius: 50%;
      border: 1.5px solid rgba(255,255,255,0.15);
      background: rgba(255,255,255,0.05);
      backdrop-filter: blur(16px);
      color: rgba(255,255,255,0.6);
      cursor: pointer;
      transition: border-color 0.3s, color 0.3s, background 0.3s;
      outline: none;
    }
    .fan-arrow:hover {
      border-color: var(--gold);
      color: var(--gold);
      background: rgba(212,175,55,0.1);
    }
    .fan-arrow svg { width: 1.1rem; height: 1.1rem; }

    .fan-dots { display: flex; align-items: center; gap: 0.5rem; }
    .fan-dot {
      width: 0.5rem; height: 0.5rem;
      border-radius: 50%;
      background: rgba(255,255,255,0.15);
      transition: background 0.3s, transform 0.3s;
    }
    .fan-dot.active { background: var(--gold); transform: scale(1.35); }

    /* back link */
    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      font-size: 0.85rem;
      color: var(--gold);
      text-decoration: none;
      margin-bottom: 1.5rem;
      opacity: 0.8;
      transition: opacity 0.2s;
    }
    .back-link:hover { opacity: 1; }
  </style>
</head>
<body>

  <!-- ── NAV ── -->
  <nav class="nav" id="nav">
    <div class="nav-inner">
      <a href="/" class="nav-logo">
        <img src="/logo.png.PNG" alt="Soul Syync Logo" class="logo-img">
        <span class="logo-text">Soul Syync</span>
      </a>
      <ul class="nav-links" id="navLinks">
        <li><a href="/">Home</a></li>
        <li><a href="/#about">About</a></li>
        <li><a href="/#services">Services</a></li>
        <li><a href="/gallery" class="active-nav">Gallery</a></li>
        <li><a href="/#testimonials">Stories</a></li>
        <li><a href="/#faq">FAQ</a></li>
        <li><a href="/#contact">Contact</a></li>
      </ul>
      <a href="/#services" class="nav-cta">Book a Session</a>
      <button class="hamburger" id="hamburger" aria-label="Menu">
        <span></span><span></span><span></span>
      </button>
    </div>
  </nav>

  <!-- ── HERO ── -->
  <div class="gallery-page-hero">
    <a href="/" class="back-link">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
      Back to Home
    </a>
    <p class="section-label">Our Moments</p>
    <h1>Healing <em>Stories</em> in Frames</h1>
    <p>Glimpses from real sessions, retreats &amp; sacred spaces at Soul Syync — where every image holds a story of transformation.</p>
    <div class="gallery-divider"></div>
  </div>

  <!-- ── FAN CAROUSEL ── -->
  <div class="fan-wrap">
    <div id="fan-container" class="fan-layout">
      <!-- Cards injected by JS -->
    </div>
    <div class="fan-pagination" id="fan-pagination">
      <button class="fan-arrow" id="fan-prev" aria-label="Previous">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="15 18 9 12 15 6"/>
        </svg>
      </button>
      <div class="fan-dots" id="fan-dots"></div>
      <button class="fan-arrow" id="fan-next" aria-label="Next">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="9 18 15 12 9 6"/>
        </svg>
      </button>
    </div>
  </div>

  <!-- ── SCRIPTS ── -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script>
  (function () {
    var CARDS = [
      "/static/images/gallery/gallery_1.jpg",
      "/static/images/gallery/gallery_2.jpg",
      "/static/images/gallery/gallery_3.jpg",
      "/static/images/gallery/gallery_4.jpg",
      "/static/images/gallery/gallery_5.jpg",
      "/static/images/gallery/gallery_6.jpg",
      "/static/images/gallery/gallery_7.jpg",
      "/static/images/gallery/gallery_8.jpg",
      "/static/images/gallery/gallery_9.jpg",
      "/static/images/gallery/gallery_10.jpg",
      "/static/images/gallery/gallery_11.jpg",
      "/static/images/gallery/gallery_12.jpg",
      "/static/images/gallery/gallery_13.jpg",
      "/static/images/gallery/gallery_14.jpg",
      "/static/images/gallery/gallery_15.jpg",
      "/static/images/gallery/gallery_16.jpg",
      "/static/images/gallery/gallery_17.jpg",
      "/static/images/gallery/gallery_18.jpg",
      "/static/images/gallery/gallery_19.jpg"
    ];

    var MAX_VISIBLE = 7, HALF = 3;
    var FAN = [
      { rot:-21, scale:0.776, x:-30, y:7.3, z:1  },
      { rot:-14, scale:0.850, x:-22, y:4.0, z:2  },
      { rot: -7, scale:0.935, x:-11, y:1.3, z:3  },
      { rot:  0, scale:1.000, x:  0, y:0.0, z:10 },
      { rot:  7, scale:0.935, x: 11, y:1.3, z:3  },
      { rot: 14, scale:0.850, x: 22, y:4.0, z:2  },
      { rot: 21, scale:0.776, x: 30, y:7.3, z:1  }
    ];

    function rMult() {
      var w = window.innerWidth;
      if (w < 480) return 0.28; if (w < 640) return 0.38;
      if (w < 768) return 0.50; if (w < 1024) return 0.75;
      return 1.0;
    }
    function hMult() {
      var w = window.innerWidth;
      var ideal = w<480?352: w<640?416: w<768?448: w<1024?544: 608;
      var avail = window.innerHeight * 0.7;
      return avail >= ideal ? 1 : avail / ideal;
    }
    function slotCfg(total, slot) {
      if (total >= MAX_VISIBLE) return FAN[slot];
      var c=total>>1, d=total>1?(slot-c)/c:0, a=Math.abs(d);
      return { rot:d*21, scale:1-0.2244*a*a, x:d*30, y:a*a*7.3, z:10-Math.abs(slot-c) };
    }

    var total=CARDS.length, paging=total>MAX_VISIBLE;
    var center=paging?HALF:(total>>1);
    var animating=false, entered=false, dir=null, prevVis={};

    var container=document.getElementById("fan-container");
    var pagination=document.getElementById("fan-pagination");
    var dotsWrap=document.getElementById("fan-dots");
    var prevBtn=document.getElementById("fan-prev");
    var nextBtn=document.getElementById("fan-next");

    if (!container) return;

    /* Build cards */
    var cardEls=[];
    CARDS.forEach(function(src,i){
      var d=document.createElement("div"); d.className="fan-card";
      var img=document.createElement("img");
      img.src=src; img.alt="Soul Syync Gallery "+(i+1);
      img.loading=i<7?"eager":"lazy";
      d.appendChild(img); container.appendChild(d); cardEls.push(d);
    });

    /* Build dots */
    if (paging) {
      pagination.style.display="flex";
      CARDS.forEach(function(_,i){
        var s=document.createElement("span");
        s.className="fan-dot"+(i===center?" active":"");
        dotsWrap.appendChild(s);
      });
    }

    function updateDots(){
      var dots=dotsWrap.querySelectorAll(".fan-dot");
      dots.forEach(function(d,i){ d.className="fan-dot"+(i===center?" active":""); });
    }

    function visMap(){
      var m={};
      if(!paging){ CARDS.forEach(function(_,i){ m[i]=i; }); return m; }
      for(var s=0;s<MAX_VISIBLE;s++){
        var ci=((center+s-HALF)%total+total)%total; m[ci]=s;
      }
      return m;
    }

    function applyLayout(){
      var vm=visMap(), isFirst=!entered;
      var rm=rMult(), hm=hMult();
      var sc=paging?MAX_VISIBLE:total;
      var cfg=function(s){ return slotCfg(sc,s); };
      var d=dir;
      if(isFirst) animating=true;
      var done=0, visCount=Object.keys(vm).length;
      function onDone(){ if(++done>=visCount){ animating=false; if(isFirst) entered=true; } }

      cardEls.forEach(function(card,ci){
        var slot=vm[ci], wasVis=prevVis[ci]!==undefined;
        if(slot!==undefined){
          var c=cfg(slot);
          var t={ x:(c.x*rm)+"rem", y:(c.y*hm)+"rem", rotation:c.rot, scale:c.scale, opacity:1, zIndex:c.z };
          if(isFirst){
            gsap.set(card,{x:0,y:(12*hm)+"rem",rotation:0,scale:0.5,opacity:0});
            gsap.to(card,Object.assign({},t,{duration:1.2,ease:"elastic.out(1.05,0.78)",delay:0.2+slot*0.06,onComplete:onDone}));
          } else if(!wasVis){
            var ex=d==="right"?40:-40;
            gsap.set(card,{x:ex+"rem",y:(c.y*hm)+"rem",rotation:d==="right"?30:-30,scale:0.5,opacity:0});
            gsap.to(card,Object.assign({},t,{duration:0.6,ease:"power2.out",onComplete:onDone}));
          } else {
            gsap.to(card,Object.assign({},t,{duration:0.5,ease:"power2.out",onComplete:onDone}));
          }
        } else if(wasVis){
          var ex2=d==="right"?-40:40;
          gsap.to(card,{x:ex2+"rem",opacity:0,scale:0.5,rotation:d==="right"?-30:30,duration:0.4,ease:"power2.in",zIndex:0});
        } else if(isFirst){
          gsap.set(card,{opacity:0,scale:0.3,x:0,y:0,zIndex:0});
        }
      });

      prevVis=vm; updateDots();

      /* Hover */
      var cSlot=(paging?MAX_VISIBLE:total)>>1, activeSlot=null, leaveTimer=null;
      var entries=[];
      cardEls.forEach(function(el,ci){ var s=vm[ci]; if(s!==undefined) entries.push({el:el,slot:s}); });
      entries.sort(function(a,b){return a.slot-b.slot;});

      function doHover(hov){
        var rm2=rMult(),hm2=hMult();
        entries.forEach(function(e){
          var c=cfg(e.slot),tx=c.x*rm2,ty=c.y*hm2,tr=c.rot,ts=c.scale;
          var dist=hov!==null?Math.abs(e.slot-hov):0;
          var delay=dist*0.02;
          if(hov!==null){
            if(e.slot===hov){ ty-=2.5*hm2; ts*=1.08; }
            else {
              var norm=cSlot>0?(e.slot-cSlot)/cSlot:0;
              var push=8*(1-Math.abs(norm))*(1+0.2*Math.max(0,3-dist));
              if(e.slot<hov){ tx-=push*rm2; tr-=3/(dist+1); }
              else           { tx+=push*rm2; tr+=3/(dist+1); }
            }
          } else { delay=Math.abs(e.slot-cSlot)*0.02; }
          gsap.to(e.el,{x:tx+"rem",y:ty+"rem",rotation:tr,scale:ts,duration:0.5,delay:delay,ease:"elastic.out(1,0.75)",overwrite:"auto"});
          gsap.set(e.el,{zIndex:c.z});
        });
      }

      entries.forEach(function(e){
        e.el.onmouseenter=function(){
          if(animating) return;
          if(leaveTimer){clearTimeout(leaveTimer);leaveTimer=null;}
          if(activeSlot!==e.slot){ activeSlot=e.slot; doHover(e.slot); }
        };
      });
      container.onmouseleave=function(){
        if(animating) return;
        if(leaveTimer) clearTimeout(leaveTimer);
        leaveTimer=setTimeout(function(){ activeSlot=null; doHover(null); },50);
      };
    }

    function cycle(direction){
      if(animating||!paging) return;
      animating=true; dir=direction;
      center=direction==="right"?(center+1)%total:(center-1+total)%total;
      applyLayout();
    }

    if(prevBtn) prevBtn.onclick=function(){ cycle("left"); };
    if(nextBtn) nextBtn.onclick=function(){ cycle("right"); };

    /* Touch */
    var tx0=0;
    container.addEventListener("touchstart",function(e){tx0=e.touches[0].clientX;},{passive:true});
    container.addEventListener("touchend",function(e){
      var diff=tx0-e.changedTouches[0].clientX;
      if(Math.abs(diff)>50) cycle(diff>0?"right":"left");
    },{passive:true});

    /* Keyboard */
    document.addEventListener("keydown",function(e){
      if(e.key==="ArrowLeft") cycle("left");
      if(e.key==="ArrowRight") cycle("right");
    });

    /* Init */
    function init(){
      if(typeof gsap==="undefined"){ setTimeout(init,100); return; }
      applyLayout();
    }
    if(document.readyState==="loading") document.addEventListener("DOMContentLoaded",init);
    else init();
  })();
  </script>

  <!-- Hamburger menu -->
  <script>
    var hamburger = document.getElementById('hamburger');
    var navLinks  = document.getElementById('navLinks');
    if (hamburger) {
      hamburger.addEventListener('click', function () {
        navLinks.classList.toggle('open');
        hamburger.classList.toggle('active');
      });
    }
    /* Scroll nav shadow */
    window.addEventListener('scroll', function () {
      document.getElementById('nav').classList.toggle('scrolled', window.scrollY > 30);
    });
  </script>

</body>
</html>
