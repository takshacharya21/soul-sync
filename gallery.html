<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gallery – Soul Syync</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
  <style>
    /* ── Page specific styles ── */
    body { background: var(--bg); color: var(--text); min-height: 100vh; }

    .gallery-page-hero {
      padding: 7rem 1rem 2rem;
      text-align: center;
    }
    .gallery-page-hero .section-label {
      display: inline-block;
      font-size: 0.75rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--gold);
      margin-bottom: 0.75rem;
    }
    .gallery-page-hero h1 {
      font-family: var(--font-serif, 'Cormorant Garamond', Georgia, serif);
      font-size: clamp(2.2rem, 5vw, 3.8rem);
      font-weight: 400;
      color: var(--text);
      line-height: 1.15;
      margin-bottom: 1rem;
    }
    .gallery-page-hero h1 em {
      font-style: italic;
      color: var(--gold);
    }
    .gallery-page-hero p {
      color: var(--text-muted, rgba(255,255,255,0.5));
      font-size: 1rem;
      max-width: 500px;
      margin: 0 auto 2rem;
      line-height: 1.7;
    }

    .gallery-divider {
      width: 60px; height: 1px;
      background: var(--gold);
      margin: 0 auto 3rem;
      opacity: 0.5;
    }

    /* ── Fan layout ── */
    .fan-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      padding: 0 1rem 5rem;
    }

    .fan-layout {
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100%;
      max-width: 80rem;
      height: 22rem;
    }
    @media (min-width: 480px)  { .fan-layout { height: 26rem; } }
    @media (min-width: 640px)  { .fan-layout { height: 28rem; } }
    @media (min-width: 768px)  { .fan-layout { height: 34rem; } }
    @media (min-width: 1024px) { .fan-layout { height: 38rem; } }

    .fan-card {
      position: absolute;
      width: 10rem; height: 15rem;
      border-radius: 1rem;
      overflow: hidden;
      box-shadow: 0 8px 32px rgba(0,0,0,0.4);
      cursor: pointer;
      will-change: transform, opacity;
      transform-origin: center bottom;
      border: 2px solid rgba(255,255,255,0.08);
      transition: box-shadow 0.3s;
    }
    @media (min-width: 480px)  { .fan-card { width: 11rem; height: 16.5rem; } }
    @media (min-width: 640px)  { .fan-card { width: 12rem; height: 18rem; } }
    @media (min-width: 768px)  { .fan-card { width: 14rem; height: 21rem; } }
    @media (min-width: 1024px) { .fan-card { width: 16rem; height: 24rem; } }

    .fan-card:hover { box-shadow: 0 20px 56px rgba(212,175,55,0.2), 0 8px 32px rgba(0,0,0,0.5); }
    .fan-card img   { width: 100%; height: 100%; object-fit: cover; display: block; pointer-events: none; user-select: none; }

    /* ── Pagination ── */
    .fan-pagination {
      display: none;
      align-items: center;
      justify-content: center;
      gap: 1rem;
      margin-top: 2rem;
    }
    .fan-arrow {
      display: flex; align-items: center; justify-content: center;
      width: 2.75rem; height: 2.75rem;
      border-radius: 50%;
      border: 1.5px solid rgba(255,255,255,0.15);
      background: rgba(255,255,255,0.05);
      backdrop-filter: blur(16px);
      color: rgba(255,255,255,0.6);
      cursor: pointer;
      transition: border-color 0.3s, color 0.3s, background 0.3s;
      outline: none;
    }
    .fan-arrow:hover {
      border-color: var(--gold);
      color: var(--gold);
      background: rgba(212,175,55,0.1);
    }
    .fan-arrow svg { width: 1.1rem; height: 1.1rem; }

    .fan-dots { display: flex; align-items: center; gap: 0.5rem; }
    .fan-dot {
      width: 0.5rem; height: 0.5rem;
      border-radius: 50%;
      background: rgba(255,255,255,0.15);
      transition: background 0.3s, transform 0.3s;
    }
    .fan-dot.active { background: var(--gold); transform: scale(1.35); }

    /* back link */
    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      font-size: 0.85rem;
      color: var(--gold);
      text-decoration: none;
      margin-bottom: 1.5rem;
      opacity: 0.8;
      transition: opacity 0.2s;
    }
    .back-link:hover { opacity: 1; }
  </style>
</head>
<body>

  <!-- ── NAV ── -->
  <nav class="nav" id="nav">
    <div class="nav-inner">
      <a href="/" class="nav-logo">
        <img src="/logo.png.PNG" alt="Soul Syync Logo" class="logo-img">
        <span class="logo-text">Soul Syync</span>
      </a>
      <ul class="nav-links" id="navLinks">
        <li><a href="/">Home</a></li>
        <li><a href="/#about">About</a></li>
        <li><a href="/#services">Services</a></li>
        <li><a href="/gallery" class="active-nav">Gallery</a></li>
        <li><a href="/#testimonials">Stories</a></li>
        <li><a href="/#faq">FAQ</a></li>
        <li><a href="/#contact">Contact</a></li>
      </ul>
      <a href="/#services" class="nav-cta">Book a Session</a>
      <button class="hamburger" id="hamburger" aria-label="Menu">
        <span></span><span></span><span></span>
      </button>
    </div>
  </nav>

  <!-- ── HERO ── -->
  <div class="gallery-page-hero">
    <a href="/" class="back-link">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
      Back to Home
    </a>
    <p class="section-label">Our Moments</p>
    <h1>Healing <em>Stories</em> in Frames</h1>
    <p>Glimpses from real sessions, retreats &amp; sacred spaces at Soul Syync — where every image holds a story of transformation.</p>
    <div class="gallery-divider"></div>
  </div>

      <div class="fan-card"><img src="/images/gallery/gallery_5.jpg" onerror="this.src='/static/images/gallery/gallery_5.jpg'" alt="Healing Moment 5" loading="lazy" /></div>

    </div>
    <div class="fan-pagination" id="fan-pagination">
      <button class="fan-arrow" id="fan-prev" aria-label="Previous">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="15 18 9 12 15 6"/>
        </svg>
      </button>
      <div class="fan-dots" id="fan-dots"></div>
      <button class="fan-arrow" id="fan-next" aria-label="Next">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="9 18 15 12 9 6"/>
        </svg>
      </button>
    </div>
  </div>

  <!-- ── SCRIPTS ── -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="/fan-carousel.js"></script>

  <!-- Hamburger menu -->
  <script>
    var hamburger = document.getElementById('hamburger');
    var navLinks  = document.getElementById('navLinks');
    if (hamburger) {
      hamburger.addEventListener('click', function () {
        navLinks.classList.toggle('open');
        hamburger.classList.toggle('active');
      });
    }
    /* Scroll nav shadow */
    window.addEventListener('scroll', function () {
      document.getElementById('nav').classList.toggle('scrolled', window.scrollY > 30);
    });
  </script>

</body>
</html>
